<!DOCTYPE html>

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家計簿アプリ</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input, select, button { margin: 5px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h2>家計簿</h2>

    <canvas id="chart" width="10" height="10"></canvas>
    <input type="number" id="amount" placeholder="金額">
    <select id="type">
        <option value="income">収入</option>
        <option value="expense">支出</option>
    </select>
    <select id="category">
        <option value="食費">食費</option>
        <option value="交通費">交通費</option>
        <option value="娯楽">娯楽</option>
    </select>
    <input type="text" id="memo" placeholder="メモ">
    <button onclick="addData()">追加</button>

    <h3 id="total">合計： 0円</h3>

    <h3>一覧</h3>
    <ul id="list"></ul>

    <div id="chart-container">
        <canvas id="chart"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
